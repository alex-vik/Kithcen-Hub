<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка продукта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:350;letter-spacing:-0.02em;font-feature-settings:"cv11" 1,"ss01" 1;background:#e3e6eb;color:#0f1012}
a{color:#0071e3}a:hover{color:#005bb8}
button{font:inherit;letter-spacing:inherit}
</style>
</helmet>
<div style="position: relative; isolation: isolate; width: 390px; height: 1240px; overflow: hidden; background: #e3e6eb; color: #0f1012; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; font-weight: 350; letter-spacing: -0.02em; box-sizing: border-box">
<div aria-hidden="true" style="position: absolute; z-index: -1; right: -130px; top: -6%; width: 340px; height: 340px; border-radius: 9999px; background: rgba(0,113,227,0.28); filter: blur(60px); pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; z-index: -1; left: -150px; top: 22%; width: 340px; height: 340px; border-radius: 9999px; background: rgba(0,113,227,0.14); filter: blur(70px); pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; z-index: -1; right: -120px; top: 48%; width: 300px; height: 300px; border-radius: 9999px; background: rgba(0,113,227,0.18); filter: blur(70px); pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; z-index: -1; left: -110px; top: 74%; width: 320px; height: 320px; border-radius: 9999px; background: rgba(0,113,227,0.12); filter: blur(70px); pointer-events: none"></div>
<div style="display: flex; flex-direction: column; gap: 22px; padding: 14px 20px 50px; box-sizing: border-box">

<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<a href="Inventory.dc.html" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 18px 0 10px; box-sizing: border-box; border-radius: 9999px; color: #0f1012; text-decoration: none; font-size: 15px; font-weight: 500; background: rgba(255,255,255,0.16); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 1.5px 1.5px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.35), inset 0 0 14px rgba(255,255,255,0.25), 0 8px 18px -12px rgba(15,16,18,0.35)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
Дома</a>
<a href="Bell.dc.html" aria-label="Открытые дела: 4" style="position: relative; width: 44px; height: 44px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.16); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 1.5px 1.5px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.35), inset 0 0 14px rgba(255,255,255,0.25), 0 8px 18px -12px rgba(15,16,18,0.35); color: #0f1012">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
<span style="position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 9999px; background: #0f1012"></span>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #4a4d52">Бакалея</span>
<h1 style="margin: 0; font-size: 27px; font-weight: 350; line-height: 1.2; letter-spacing: -0.02em">Кофе в зёрнах</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; padding: 30px 22px; background: rgba(255,255,255,0.2); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); border: 0.5px solid rgba(255,255,255,0.9); box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,1); border-radius: 36px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4a4d52">
<span style="width: 10px; height: 10px; border-radius: 9999px; background: #E6A23C"></span>
Остаток
</span>
<span style="font-size: 12px; font-weight: 400; padding: 4px 10px; border-radius: 9999px; border: 0.5px solid rgba(0,0,0,0.14)">Скоро</span>
</div>
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<span style="font-size: 44px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em">≈ 110 г</span>
<span style="font-size: 15px; color: #4a4d52">хватит на 3 дня</span>
</div>
<div style="height: 4px; border-radius: 9999px; background: rgba(12,13,15,0.08); overflow: hidden">
<div style="width: 44%; height: 100%; border-radius: 9999px; background: #0f1012"></div>
</div>
<span style="font-size: 13px; color: #4a4d52; line-height: 1.4">Уверенность высокая: последняя сверка 5 дней назад</span>
</div>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 22px; font-size: 12px; font-weight: 400; color: #4a4d52">Учёт</h2>
<div style="display: flex; flex-direction: column; padding: 4px 22px; background: rgba(255,255,255,0.2); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); border: 0.5px solid rgba(255,255,255,0.9); box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,1); border-radius: 36px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
<button type="button" style="{{f.row}}">
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
<span style="font-size: 13px; color: #4a4d52">{{f.label}}</span>
<span style="{{f.valueStyle}}">{{f.value}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8f8f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 22px; font-size: 12px; font-weight: 400; color: #4a4d52">Последние события</h2>
<div style="display: flex; flex-direction: column; padding: 4px 22px; background: rgba(255,255,255,0.2); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); border: 0.5px solid rgba(255,255,255,0.9); box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,1); border-radius: 36px">
<sc-for list="{{events}}" as="e" hint-placeholder-count="4">
<div style="{{e.row}}">
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
<span style="font-size: 15px">{{e.what}}</span>
<span style="font-size: 13px; color: #4a4d52">{{e.when}}</span>
</span>
<span style="font-size: 15px; font-variant-numeric: tabular-nums">{{e.delta}}</span>
</div>
</sc-for>
</div>
</section>

<button type="button" style="height: 56px; border-radius: 9999px; color: #0f1012; font-size: 16px; font-weight: 500; cursor: pointer; background: rgba(255,255,255,0.16); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 1.5px 1.5px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.35), inset 0 0 14px rgba(255,255,255,0.25), 0 8px 18px -12px rgba(15,16,18,0.35)">Больше не покупаю</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const sep = (i, n) => (i < n - 1 ? 'border-bottom: 0.5px solid rgba(0,0,0,0.08)' : '');
    const f = [
      { label: 'Тип списания', value: 'Ритмичный, определён по истории' },
      { label: 'Норма', value: '36 г в день, две чашки' },
      { label: 'Порция', value: '18 г' },
      { label: 'Упаковка', value: 'Пачка 250 г' },
      { label: 'Нижний порог', value: 'Не задан' },
      { label: 'Товар в магазине', value: 'Привязать', link: true }
    ];
    const e = [
      { what: 'Автосписание по норме', when: 'Сегодня, 03:00', delta: '−36 г' },
      { what: 'Вторая чашка, с киоска', when: 'Вчера, 16:20', delta: '−18 г' },
      { what: 'Автосписание по норме', when: 'Вчера, 03:00', delta: '−36 г' },
      { what: 'Покупка по списку', when: 'Суббота', delta: '+250 г' }
    ];
    return {
      fields: f.map((x, i) => ({
        label: x.label,
        value: x.value,
        valueStyle: 'font-size: 16px; ' + (x.link ? 'color: #0071e3' : 'color: #0f1012'),
        row: 'display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 0; box-sizing: border-box; border: 0; background: transparent; color: #0f1012; text-align: left; cursor: pointer; ' + sep(i, f.length)
      })),
      events: e.map((x, i) => Object.assign({}, x, {
        row: 'display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; box-sizing: border-box; ' + sep(i, e.length)
      }))
    };
  }
}
</script>
</body>
</html>
