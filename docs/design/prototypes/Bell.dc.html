<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Открытые дела</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:350;letter-spacing:-0.02em;font-feature-settings:"cv11" 1,"ss01" 1;background:#e3e6eb;color:#0f1012}
a{color:#0071e3}a:hover{color:#005bb8}
button{font:inherit;letter-spacing:inherit}
</style>
</helmet>
<div style="position: relative; isolation: isolate; width: 390px; height: 844px; overflow: hidden; background: #e3e6eb; color: #0f1012; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; font-weight: 350; letter-spacing: -0.02em; box-sizing: border-box">
<div aria-hidden="true" style="position: absolute; z-index: -1; right: -130px; top: -6%; width: 340px; height: 340px; border-radius: 9999px; background: rgba(0,113,227,0.28); filter: blur(60px); pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; z-index: -1; left: -150px; top: 22%; width: 340px; height: 340px; border-radius: 9999px; background: rgba(0,113,227,0.14); filter: blur(70px); pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; z-index: -1; right: -120px; top: 48%; width: 300px; height: 300px; border-radius: 9999px; background: rgba(0,113,227,0.18); filter: blur(70px); pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; z-index: -1; left: -110px; top: 74%; width: 320px; height: 320px; border-radius: 9999px; background: rgba(0,113,227,0.12); filter: blur(70px); pointer-events: none"></div>
<div style="display: flex; flex-direction: column; gap: 22px; padding: 14px 20px 50px; box-sizing: border-box">

<div style="display: flex; align-items: center; height: 48px">
<a href="Review.dc.html" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 18px 0 10px; box-sizing: border-box; border-radius: 9999px; color: #0f1012; text-decoration: none; font-size: 15px; font-weight: 500; background: rgba(255,255,255,0.16); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 1.5px 1.5px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.35), inset 0 0 14px rgba(255,255,255,0.25), 0 8px 18px -12px rgba(15,16,18,0.35)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
Назад</a>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #4a4d52">Уходят, когда сделаны</span>
<h1 style="margin: 0; font-size: 27px; font-weight: 350; line-height: 1.2; letter-spacing: -0.02em">Открытые дела</h1>
</div>

<div style="display: flex; flex-direction: column; padding: 4px 22px; background: rgba(255,255,255,0.2); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); border: 0.5px solid rgba(255,255,255,0.9); box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,1); border-radius: 36px">
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="{{t.row}}">
<span style="{{t.dot}}"></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
<span style="font-size: 16px; line-height: 1.3">{{t.title}}</span>
<span style="font-size: 13px; color: #4a4d52; line-height: 1.4">{{t.sub}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8f8f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</div>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 22px; font-size: 12px; font-weight: 400; color: #4a4d52">Настройки</h2>
<div style="display: flex; flex-direction: column; padding: 4px 22px; background: rgba(255,255,255,0.2); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); border: 0.5px solid rgba(255,255,255,0.9); box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,1); border-radius: 36px">
<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 0; border: 0; border-bottom: 0.5px solid rgba(0,0,0,0.08); background: transparent; color: #0f1012; font-size: 16px; cursor: pointer; text-align: left">Отпуск<span style="font-size: 14px; color: #4a4d52">Не запланирован</span></button>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 0; border: 0; border-bottom: 0.5px solid rgba(0,0,0,0.08); background: transparent; color: #0f1012; font-size: 16px; cursor: pointer; text-align: left">Напоминание о пересмотре<span style="font-size: 14px; color: #4a4d52">Чт, 19:00</span></button>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 0; border: 0; background: transparent; color: #0f1012; font-size: 16px; cursor: pointer; text-align: left">Режим пересмотра<span style="font-size: 14px; color: #4a4d52">Базовый</span></button>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (c) => 'width: 10px; height: 10px; border-radius: 9999px; flex-shrink: 0; background: ' + c;
    const t = [
      { title: 'Пройти пересмотр', sub: 'Открыт с четверга, закупка в субботу', href: 'Review.dc.html', dot: dot('#0f1012') },
      { title: 'Молоко: купить', sub: 'Кончится завтра утром', href: 'Inventory.dc.html', dot: dot('#C8372D') },
      { title: 'Блины во вторник не отмечены', sub: 'Готовили или нет?', href: 'Review.dc.html', dot: dot('rgba(15,16,18,0.35)') },
      { title: 'Соль: пачка к концу срока', sub: 'Проверьте, сколько осталось', href: 'Inventory.dc.html', dot: dot('#E6A23C') }
    ];
    return {
      tasks: t.map((x, i) => Object.assign({}, x, {
        row: 'display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 10px 0; box-sizing: border-box; color: #0f1012; text-decoration: none; ' + (i < t.length - 1 ? 'border-bottom: 0.5px solid rgba(0,0,0,0.08)' : '')
      }))
    };
  }
}
</script>
</body>
</html>
