<div aria-hidden="true" style="position: absolute; z-index: -1; left: 520px; top: -180px; width: 380px; height: 380px; border-radius: 9999px; background: rgba(255,255,255,0.9); filter: blur(70px); pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; z-index: -1; right: 60px; bottom: -220px; width: 460px; height: 460px; border-radius: 9999px; background: rgba(0,113,227,0.22); filter: blur(80px); pointer-events: none"></div>

<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 30px">

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">

<span style="width: 96px; height: 96px; border-radius: 9999px; background: #fdfdfd; color: #0071e3; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px -4px rgba(15,16,18,0.3)">

<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>

<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск продукта</span>

</button>

</div>
</div>

<sc-if value="{{isOutcome}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 22px; flex-grow: 1">
<div style="display: flex; align-items: center; gap: 16px; height: 60px">
<button type="button" onClick="{{goOff}}" aria-label="К списку продуктов" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #0f1012; cursor: pointer; background: rgba(255,255,255,0.16); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 1.5px 1.5px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.35), inset 0 0 14px rgba(255,255,255,0.25), 0 8px 18px -12px rgba(15,16,18,0.35)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<h2 style="margin: 0; font-size: 27px; font-weight: 350; line-height: 1.2">{{selName}}</h2>
</div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{outcomes}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 30px; box-sizing: border-box; border-radius: 54px; color: #0f1012; cursor: pointer; text-align: left; background: rgba(255,255,255,0.14); backdrop-filter: blur(26px) saturate(1.8); -webkit-backdrop-filter: blur(26px) saturate(1.8); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 2px 2px 1px rgba(255,255,255,0.85), inset -1.5px -1.5px 1px rgba(255,255,255,0.4), inset 0 0 24px rgba(255,255,255,0.28), 0 14px 30px -18px rgba(15,16,18,0.35)">
<span style="{{o.disc}}">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 26px; font-weight: 500; line-height: 1.15">{{o.title}}</span>
<span style="font-size: 16px; color: #4a4d52; line-height: 1.35">{{o.sub}}</span>
</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isAdd}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 22px; flex-grow: 1">
<div style="display: flex; align-items: center; gap: 16px; height: 60px">
<button type="button" onClick="{{back}}" aria-label="Назад" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #0f1012; cursor: pointer; background: rgba(255,255,255,0.16); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 1.5px 1.5px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.35), inset 0 0 14px rgba(255,255,255,0.25), 0 8px 18px -12px rgba(15,16,18,0.35)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<h2 style="margin: 0; font-size: 27px; font-weight: 350; line-height: 1.2">Как добавляем?</h2>
</div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{intake}}" as="w" hint-placeholder-count="4">
<button type="button" onClick="{{w.pick}}" style="display: flex; align-items: center; gap: 20px; padding: 0 30px 0 22px; box-sizing: border-box; border-radius: 9999px; color: #0f1012; cursor: pointer; text-align: left; background: rgba(255,255,255,0.14); backdrop-filter: blur(26px) saturate(1.8); -webkit-backdrop-filter: blur(26px) saturate(1.8); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 2px 2px 1px rgba(255,255,255,0.85), inset -1.5px -1.5px 1px rgba(255,255,255,0.4), inset 0 0 24px rgba(255,255,255,0.28), 0 14px 30px -18px rgba(15,16,18,0.35)">
<span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 9999px; background: #fdfdfd; color: #0071e3; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px -4px rgba(15,16,18,0.3)">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.icon}}"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-size: 21px; font-weight: 500; line-height: 1.2">{{w.title}}</span>
<span style="font-size: 15px; color: #4a4d52; line-height: 1.35">{{w.sub}}</span>
</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

</div>

<div style="height: 64px; display: flex; align-items: center">
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 18px; height: 64px; padding: 0 8px 0 26px; box-sizing: border-box; border-radius: 9999px; color: #fdfdfd; font-size: 17px; background: rgba(15,16,18,0.62); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border: 1px solid rgba(255,255,255,0.25); box-shadow: inset 1.5px 1.5px 1px rgba(255,255,255,0.3), 0 12px 26px -16px rgba(15,16,18,0.5)">
<span>{{toast}}</span>
<sc-if value="{{canUndo}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{undo}}" style="height: 48px; padding: 0 22px; border-radius: 9999px; color: #fdfdfd; font-size: 16px; font-weight: 500; cursor: pointer; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.35); box-shadow: inset 1px 1px 1px rgba(255,255,255,0.4)">Отменить</button>
</sc-if>
</div>
</sc-if>
</div>
</div>

<aside style="display: flex; flex-direction: column; gap: 22px; padding: 40px; box-sizing: border-box; border-radius: 54px; min-width: 0; min-height: 0; background: rgba(255,255,255,0.2); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); border: 0.5px solid rgba(255,255,255,0.9); box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,1)">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #4a4d52">Сегодня</span>
<h2 style="margin: 0; font-size: 22px; font-weight: 350; line-height: 1.2">Купить в первую очередь</h2>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{urgent}}" as="u" hint-placeholder-count="5">
<div style="{{u.row}}">
<span style="{{u.dot}}"></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
<span style="font-size: 18px">{{u.name}}</span>
<span style="font-size: 14px; color: #4a4d52">{{u.note}}</span>
</span>
<span style="font-size: 12px; font-weight: 400; padding: 4px 10px; border-radius: 9999px; border: 0.5px solid rgba(0,0,0,0.16); white-space: nowrap">{{u.label}}</span>
</div>
</sc-for>
</div>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const mode = s.mode || 'home';
    const go = (m) => () => this.setState({ mode: m, toast: '' });
    const finish = (text) => () => this.setState({ mode: 'home', toast: text, canUndo: true });
    const base = [
      { name: 'Молоко', portion: 'порция 250 мл' },
      { name: 'Кофе в зёрнах', portion: 'порция 18 г' },
      { name: 'Хлеб', portion: 'порция 2 ломтика' },
      { name: 'Яйца', portion: 'порция 2 шт' },
      { name: 'Сливочное масло', portion: 'порция 10 г' },
      { name: 'Гречка', portion: 'порция 80 г' },
      { name: 'Сыр', portion: 'порция 30 г' },
      { name: 'Корм', portion: 'порция 1 пакетик' }
    ];
    const products = base.map((p) => Object.assign({}, p, { pick: () => this.setState({ mode: 'outcome', sel: p, toast: '' }) }));
    const sel = s.sel || base[0];
    const discOn = 'width: 64px; height: 64px; border-radius: 9999px; background: #fdfdfd; color: #0071e3; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px -4px rgba(15,16,18,0.3)';
    const discOff = 'width: 64px; height: 64px; border-radius: 9999px; background: rgba(255,255,255,0.18); color: #0f1012; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 1.5px 1.5px 1px rgba(255,255,255,0.85), inset 0 0 12px rgba(255,255,255,0.25)';
    const outcomes = [
      { title: 'Съел порцию', sub: 'Минус ' + sel.portion.replace('порция ', ''), icon: 'M6 12h12', disc: discOn, pick: finish('Списано: ' + sel.name.toLowerCase() + ', одна порция') },
      { title: 'Закончилось', sub: 'Остаток обнулится, продукт сразу в списке покупок', icon: 'M5 12l5 5 9-10', disc: discOn, pick: finish(sel.name + ': закончилось, добавлено в список') },
      { title: 'Испортилось', sub: 'Выброшено, прогноз это не учитывает', icon: 'M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12', disc: discOff, pick: finish(sel.name + ': отмечено как выброшенное') }
    ];
    const intake = [
      { title: 'По списку покупок', sub: 'Отметить то, что купили', icon: 'M10 6h10M10 12h10M10 18h10M4 6h1M4 12h1M4 18h1', msg: 'Откройте список на телефоне' },
      { title: 'Фото чека', sub: 'Распознаётся и пишется сразу', icon: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', msg: 'Чек распознан: 9 позиций записано' },
      { title: 'Фото стола', sub: 'Всё, что в кадре, одним снимком', icon: 'M4 8h3l2-3h6l2 3h3v11H4zM12 16a3 3 0 100-6 3 3 0 000 6z', msg: 'На фото 6 продуктов, остатки обновлены' },
      { title: 'Найти в каталоге', sub: 'Вручную, по одной позиции', icon: 'M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4', msg: 'Добавлено вручную' }
    ].map((w) => Object.assign({}, w, { pick: finish(w.msg) }));
    const dot = (c) => 'width: 10px; height: 10px; border-radius: 9999px; flex-shrink: 0; background: ' + c;
    const RED = dot('#C8372D'), AMB = dot('#E6A23C');
    const raw = [
      { name: 'Молоко', note: 'кончится завтра утром', d: RED, label: 'Купить' },
      { name: 'Кофе в зёрнах', note: 'хватит на 3 дня', d: AMB, label: 'Скоро' },
      { name: 'Яйца', note: 'осталось около 4 шт', d: AMB, label: 'Скоро' },
      { name: 'Гречка', note: 'отмечено: мало', d: AMB, label: 'Скоро' },
      { name: 'Соль', note: 'пачка к концу срока', d: AMB, label: 'Скоро' }
    ];
    const urgent = raw.map((u, i) => ({
      name: u.name, note: u.note, dot: u.d, label: u.label,
      row: 'display: flex; align-items: center; gap: 14px; min-height: 68px; box-sizing: border-box; ' + (i < raw.length - 1 ? 'border-bottom: 0.5px solid rgba(0,0,0,0.1)' : '')
    }));
    return {
      isHome: mode === 'home',
      isPick: mode === 'pick',
      isOutcome: mode === 'outcome',
      isAdd: mode === 'add',
      products: products,
      outcomes: outcomes,
      intake: intake,
      urgent: urgent,
      selName: sel.name,
      goOff: go('pick'),
      goAdd: go('add'),
      back: go('home'),
      hasToast: mode === 'home' && !!s.toast,
      toast: s.toast || '',
      canUndo: !!s.canUndo,
      undo: () => this.setState({ toast: 'Действие отменено', canUndo: false })
    };
  }
}
</script>
